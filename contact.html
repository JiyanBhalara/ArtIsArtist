<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact – Craft Boutique</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="lookbook.html">Lookbook</a></li>
      <li><a href="workshops.html">Workshops</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <main>
    <h1>Contact Us</h1>
    <div class="contact-container">
      <!-- Contact Form -->
      <div class="contact-form">
        <form action="index.html">
          <label for="name">Name</label><br>
          <input type="text" id="name" name="name" placeholder="Your name"><br>
          <label for="email">Email</label><br>
          <input type="email" id="email" name="email" placeholder="Your email"><br>
          <label for="message">Message</label><br>
          <textarea id="message" name="message" rows="5" placeholder="Your message"></textarea><br>
          <button type="submit" class="btn">Send Message</button>
        </form>
      </div>

      <!-- FAQ -->
      <div class="faq">
        <h2>FAQ</h2>
        <p><strong>Q:</strong> Do you take custom orders?<br>
           <strong>A:</strong> Yes! Send your ideas and we’ll craft it for you.</p>
        <p><strong>Q:</strong> Shipping time?<br>
           <strong>A:</strong> Typically 5–7 business days.</p>
      </div>
    </div>
  </main>

  <footer>
    <a href="index.html" class="btn">← Back to Home</a>
  </footer>
</body>
</html>
